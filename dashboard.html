<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTB Dashboard</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#111}
.k{display:flex;gap:12px;flex-wrap:wrap}.c{background:#fff;border-radius:10px;padding:12px 16px;flex:1;min-width:110px}
.c b{display:block;font-size:22px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;margin-top:16px}
td,th{padding:8px;text-align:right;border-bottom:1px solid #eee}td:first-child,th:first-child{text-align:left}
.bar{background:#e5e7eb;height:8px;border-radius:4px;overflow:hidden}.bar i{display:block;height:8px;background:#2563eb}
button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;margin:12px 8px 0 0}
</style></head><body>
<h2>Ad Exchange Dashboard</h2>
<div class="k" id="k"></div>
<button onclick="sim(50)">Simulate 50 requests</button><button onclick="sim(500)">Simulate 500</button><button onclick="fetch('/reset',{method:'POST'})" style="background:#6b7280">Reset</button>
<div style="overflow-x:auto"><table><thead><tr><th>Advertiser</th><th>Wins</th><th>Clicks</th><th>CTR%</th><th>Spend</th><th>Budget used</th></tr></thead><tbody id="t"></tbody></table></div>
<script>
async function sim(n){for(let i=0;i<n;i++){const r=await(await fetch('/bid-request',{method:'POST',body:JSON.stringify({user:'u'+(i%40),category:i%3?'general':'sports'})})).json();
if(r.filled&&Math.random()<0.15)fetch('/click',{method:'POST',body:JSON.stringify({impressionId:r.impressionId})});}}
async function load(){const s=await(await fetch('/stats')).json();
k.innerHTML=[['Requests',s.requests],['No fill',s.noFill],['p50 ms',s.p50],['p99 ms',s.p99]].map(x=>`<div class=c>${x[0]}<b>${x[1]}</b></div>`).join('');
t.innerHTML=s.advertisers.map(a=>`<tr><td>${a.name}</td><td>${a.wins}</td><td>${a.clicks}</td><td>${a.ctr}</td><td>$${a.spend}</td><td><div class=bar><i style="width:${Math.min(100,100*a.spend/a.budget)}%"></i></div></td></tr>`).join('');}
setInterval(load,1000);load();
</script></body></html>
